<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lahza</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1f201b;
        color: #f1ede3;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      .artboard {
        width: 1600px;
        height: 720px;
        background: #292a24;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        overflow: hidden;
        position: relative;
      }

      .artboard::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 78% 42%, rgba(222, 212, 191, 0.1), transparent 36%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 42%);
        pointer-events: none;
      }

      .copy,
      .stage {
        position: relative;
        z-index: 1;
      }

      .copy {
        padding: 72px 64px 72px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .kicker {
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #aaa398;
        margin-bottom: 18px;
      }

      .name-row {
        display: flex;
        align-items: baseline;
        gap: 22px;
      }

      h1 {
        margin: 0;
        font-size: 92px;
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.9;
        color: #f1ede3;
      }

      .arabic {
        font-family: "Noto Naskh Arabic", "Times New Roman", serif;
        font-size: 42px;
        color: #ded4bf;
        letter-spacing: 0;
        line-height: 1;
      }

      p {
        margin: 26px 0 0;
        max-width: 560px;
        font-size: 22px;
        line-height: 1.45;
        color: #d2ccc0;
      }

      .pills {
        display: flex;
        gap: 10px;
        margin-top: 34px;
        flex-wrap: wrap;
      }

      .pills span {
        border: 1px solid #5a5b51;
        background: #373830;
        color: #f1ede3;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .stage {
        display: grid;
        place-items: center;
      }

      .device {
        width: 320px;
        height: 520px;
        background: #303129;
        border: 1px solid #5a5b51;
        border-radius: 28px;
        padding: 28px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        box-shadow: 0 24px 60px rgba(8, 8, 6, 0.4);
      }

      .device-top {
        width: 100%;
        display: flex;
        justify-content: space-between;
        color: #aaa398;
        font-size: 13px;
      }

      .ring {
        width: 210px;
        height: 210px;
        border-radius: 50%;
        background: conic-gradient(#ded4bf 0 72deg, #303129 72deg 360deg);
        mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
        box-shadow: 0 0 48px 8px rgba(222, 212, 191, 0.16);
      }

      .time {
        margin-top: -148px;
        text-align: center;
      }

      .time small {
        display: block;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #aaa398;
        font-size: 11px;
        margin-bottom: 8px;
      }

      .time strong {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 48px;
        font-weight: 500;
        letter-spacing: -0.06em;
        color: #f1ede3;
      }

      .cta {
        margin-top: auto;
        width: 100%;
        background: #ded4bf;
        color: #292a24;
        border-radius: 10px;
        text-align: center;
        padding: 14px 12px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="artboard">
      <div class="copy">
        <div class="kicker">A quieter way to hold time</div>
        <div class="name-row">
          <h1>Lahza</h1>
          <span class="arabic" lang="ar" dir="rtl">لحظة</span>
        </div>
        <p>
          A focus timer for Chrome. Classic Pomodoro, or set the minutes yourself. Pin it, and the icon keeps the time.
        </p>
        <div class="pills">
          <span>Focus</span>
          <span>Break</span>
          <span>Long break</span>
        </div>
      </div>
      <div class="stage">
        <div class="device">
          <div class="device-top">
            <span>Lahza</span>
            <span>Focus</span>
          </div>
          <div class="ring"></div>
          <div class="time">
            <small>Focus</small>
            <strong>24:12</strong>
          </div>
          <div class="cta">Start focus</div>
        </div>
      </div>
    </div>
  </body>
</html>
